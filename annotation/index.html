<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manuscript annotations</title>
  <style>/*__STYLE__*/</style>
</head>
<body>
  <header><div><span class="eyebrow">LOCAL MANUSCRIPT REVIEW</span><h1>Read. Annotate. Export.</h1><p>Sample manuscript · Select a paragraph to leave a revision request.</p></div><button id="export">Export comments.jsonl</button></header>
  <p id="notice" role="status" aria-live="polite">Comments are saved in this browser. Export a copy to keep them.</p>
  <div class="layout">
    <main id="manuscript" aria-label="Manuscript"></main>
    <aside aria-label="Revision comments">
      <h2>Revision comments <span id="count">0</span></h2>
      <form id="editor" hidden>
        <h3 id="editor-title">New comment</h3>
        <p id="target"></p>
        <div class="fields">
          <label>Type<select id="type"><option>clarity</option><option>logic</option><option>structure</option><option>claim</option><option>evidence</option><option>citation</option><option>grammar</option><option>methodology</option><option>novelty</option><option>figure</option><option>terminology</option></select></label>
          <label>Priority<select id="priority"><option>low</option><option selected>medium</option><option>high</option></select></label>
        </div>
        <label>Instruction<textarea id="instruction" required rows="3" placeholder="What should change?"></textarea></label>
        <label>Reason<textarea id="reason" rows="2" placeholder="Why is this change needed?"></textarea></label>
        <label>Status<select id="status"><option>open</option><option>resolved</option><option>deferred</option></select></label>
        <div class="actions"><button type="submit">Save comment</button><button type="button" id="cancel" class="secondary">Cancel</button></div>
      </form>
      <div id="comments"></div>
    </aside>
  </div>
  <script id="data" type="application/json">__MANUSCRIPT_DATA__</script>
  <script>/*__SCRIPT__*/</script>
</body>
</html>
